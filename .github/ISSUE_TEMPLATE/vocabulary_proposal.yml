name: Proposta de vocabulário
description: Proponha termo, sentido ou forma evitada.
title: "vocabulary: "
labels: [vocabulary, triage]
body:
  - type: input
    id: locale
    attributes:
      label: Localidade
      placeholder: pt-BR
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Domínio e escopo
      placeholder: núcleo, software, energia...
    validations:
      required: true
  - type: input
    id: preferred
    attributes:
      label: Termo preferido
    validations:
      required: true
  - type: textarea
    id: definition
    attributes:
      label: Definição operacional
    validations:
      required: true
  - type: textarea
    id: forms
    attributes:
      label: Formas admitidas e proibidas
  - type: textarea
    id: evidence
    attributes:
      label: Evidência de uso e fontes
    validations:
      required: true

