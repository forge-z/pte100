name: Defeito na especificação
description: Relate incoerência, link quebrado ou erro reproduzível.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Não inclua dados confidenciais nem vulnerabilidades neste formulário.
  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: PTE-100 0.1
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Informe arquivo, seção ou regra e o resultado observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidência ou exemplo mínimo
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei issues existentes.
          required: true
        - label: Removi informações confidenciais.
          required: true

