name: Proposta de regra
description: Proponha uma regra nova ou uma mudança normativa.
title: "proposal: "
labels: [proposal, normative]
body:
  - type: input
    id: provisional_id
    attributes:
      label: Identificador provisório
      placeholder: P-2026-001
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Categoria
      options: [léxico, frase, procedimento, alerta, dados, estrutura, IA]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema observável
      description: Explique ambiguidade, inconsistência ou falha de processamento.
    validations:
      required: true
  - type: textarea
    id: corpus
    attributes:
      label: Evidência
      description: Forneça corpus, estudo ou casos anonimizados e sua licença.
    validations:
      required: true
  - type: textarea
    id: wording
    attributes:
      label: Descrição proposta
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Incorreto e correto
    validations:
      required: true
  - type: textarea
    id: lint
    attributes:
      label: Estratégia de lint e falsos positivos
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Compatibilidade e migração
    validations:
      required: true
  - type: checkboxes
    id: conflicts
    attributes:
      label: Transparência
      options:
        - label: Declarei vínculos ou interesses relevantes no texto.
          required: true

